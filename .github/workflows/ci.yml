name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ebookstore
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ebookstore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ebookstore" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ebookstore:ci-only-password@127.0.0.1:5432/ebookstore_test
      DATABASE_URL: postgresql://ebookstore:ci-only-password@127.0.0.1:5432/ebookstore_test
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run openapi:validate
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
